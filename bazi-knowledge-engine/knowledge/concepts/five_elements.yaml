      - kind: "season"
        value: "季夏"
        scope: "《淮南子》時則訓的季夏段與土並列；只指該框架中的夏季末段，不等於土唯一對應整個夏季。"
        source_ids:
          - "huainan_shize"
        source_status:
          value: "source_attested"
          note: "已核對指定文獻中的此項對應；不是對自然因果的驗證。"
      - kind: "season"
        value: "四季末／季節轉換"
        scope: "另一種將土放在各季末段的說明；與季夏說如何整合、時間邊界如何界定，另待核對。"
        source_ids:
          - "sanming_renyuan"
          - "concept_spec"
        source_status:
          value: "requires_validation"
          note: "文獻存在不同配屬語境；尚未選定統一的時間規則。"
    notes:
      - "季夏與各季末段分別保存，不以其中一說覆蓋另一說。"
    source_ids:
