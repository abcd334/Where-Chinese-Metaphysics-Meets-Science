  - id: "earth"
    name_zh: "土"
    short_definition: "傳統五行之一，本層以承載、轉化與居中等意象說明。"
    plain_explanation: "用土地承接、培育作物與居中的意象理解分類；這些是教學用語。土的季節配屬有不同框架，不能壓成一個沒有條件的答案。"
    traditional_associations:
      - kind: "symbol"
        value: "承載、轉化與居中"
