concepts:
  - id: "five_elements"
    name_zh: "五行"
    short_definition: "以木、火、土、金、水組織傳統分類與對應關係的概念框架。"
    plain_explanation: "五行名稱借用熟悉的事物，卻不只表示五種實體材料；傳統文本也用它們組織性質、季節及方向。這是特定文化框架，不是現代化學元素表。概念說明、象徵對應及生剋資料各有不同欄位。"
    traditional_associations: []
    notes: []
    source_ids:
      - "shangshu_hongfan"
      - "huainan_tianwen"
      - "concept_spec"
    source_status:
      value: "traditional_common"
      note: "傳統概念的教學改寫；僅說明所採框架，不是自然科學定律或個人預測。"
  - id: "wood"
    name_zh: "木"
    short_definition: "傳統五行之一，本層以生長、萌發與伸展等意象說明。"
    plain_explanation: "用植物生長及枝條伸展作為理解分類的比喻，不只指一棵實際的樹。"
    traditional_associations:
      - kind: "symbol"
        value: "生長、萌發與伸展"
        scope: "使用者規格指定的傳統象徵教學摘要；不視為古籍逐字定義。"
        source_ids:
          - "concept_spec"
        source_status:
          value: "traditional_common"
          note: "傳統概念的教學改寫；僅說明所採框架，不是自然科學定律或個人預測。"
      - kind: "symbol"
        value: "曲直"
        scope: "《尚書》洪範的五行描述；保留詞語並以白話說明，不延伸到人格。"
        source_ids:
          - "shangshu_hongfan"
        source_status:
          value: "source_attested"
          note: "已核對指定文獻中的此項對應；不是對自然因果的驗證。"
      - kind: "direction"
        value: "東"
        scope: "傳統五行方位對應；中央不表示地理上的第五個羅盤方向。"
        source_ids:
          - "huainan_tianwen"
        source_status:
          value: "source_attested"
          note: "已核對指定文獻中的此項對應；不是對自然因果的驗證。"
      - kind: "season"
        value: "春"
        scope: "《淮南子》天文訓的五行四時對應；不是任何地點的即時氣候判定。"
        source_ids:
          - "huainan_tianwen"
        source_status:
