  - id: "generates"
    name_zh: "相生"
    short_definition: "五行系統中用來表示生發、滋養或承接的一種有向關係模式。"
    plain_explanation: "相生是傳統關係名稱，不等於物質必然製造另一種物質，也不是好壞判斷。要查哪個五行生哪個五行，使用既有 Fact 關係資料；這裡不再存一份對應表。"
    traditional_associations: []
