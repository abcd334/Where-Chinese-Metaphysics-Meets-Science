[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "bazi-knowledge-engine"
version = "0.1.0"
description = "Machine-readable foundational Bazi data, without interpretation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
app = ["streamlit>=1.41,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/bazi_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
knowledge = "bazi_knowledge/knowledge"

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/TODO.md", "/pyproject.toml", "/streamlit_app.py", "/docs", "/knowledge", "/src", "/tests", "/examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
